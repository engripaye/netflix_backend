[package]
name = "netflix_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.7"
dotenv = "0.15.0"
request = { version = "0.12.4", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"]}
